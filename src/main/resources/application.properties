spring.application.name=Sindibad

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:32768/postgres}
spring.datasource.username=${DB_USERNAME:Sindibad}
spring.datasource.password=${DB_PASSWORD:App1234}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000